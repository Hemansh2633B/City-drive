name: tests

on:
  push:
    branches: [main, ai-training-focus]
  pull_request:
    branches: [main, ai-training-focus]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and optional viewer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,render]"
      - name: Run tests
        run: python -m pytest tests/ -q

  tensor-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch for tensor-backend parity tests
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run GPU-backend CPU parity suite
        run: python -m pytest tests/test_gpu_parity.py tests/test_gpu_evolution.py -q
